<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau Blanc Partagé</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #whiteboard {
            width: 80%;
            height: 80%;
            background-color: white;
            border: 2px solid #000;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            overflow: auto;
            font-size: 18px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="saveContent()">Sauvegarder</button>
        <button onclick="clearWhiteboard()">Effacer</button>
    </div>
    <div
         id="whiteboard"
         contenteditable="true"
         oninput="markAsModified()"
    >
        Chargement en cours...
    </div>

    <script>
        // Remplace ces variables par tes informations
        const GITHUB_USER = "TON_PSEUDO";
        const REPO_NAME = "NOM_DU_DEPOT";
        const TOKEN = "TON_TOKEN_GITHUB"; // ⚠️ À ne pas partager !

        // URL du fichier data.json sur GitHub
        const DATA_URL = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/data.json`;

        // Variable pour suivre si le contenu a été modifié
        let isModified = false;

        // Marque le contenu comme modifié
        function markAsModified() {
            isModified = true;
        }

        // Charge le contenu depuis data.json
        async function loadContent() {
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/data.json`);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('whiteboard').innerHTML = data.content || "Écrivez ici...";
                } else {
                    // Si data.json n'existe pas, on le crée avec un contenu par défaut
                    document.getElementById('whiteboard').innerHTML = "Écrivez ici...";
                }
            } catch (error) {
                console.error("Erreur lors du chargement :", error);
                document.getElementById('whiteboard').innerHTML = "Écrivez ici...";
            }
        }

        // Sauvegarde le contenu dans data.json
        async function saveContent() {
            const content = document.getElementById('whiteboard').innerHTML;
            const data = { content: content };

            try {
                // On encode le contenu en base64 pour GitHub
                const encodedContent = btoa(JSON.stringify(data));

                // On vérifie si data.json existe déjà
                const getResponse = await fetch(DATA_URL, {
                    headers: {
                        'Authorization': `token ${TOKEN}`
                    }
                });

                let method = 'POST';
                let url = DATA_URL;
                let sha = null;

                if (getResponse.ok) {
                    const fileData = await getResponse.json();
                    method = 'PUT';
                    sha = fileData.sha;
                }

                // On envoie la requête pour créer/mettre à jour data.json
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `token ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Mise à jour du tableau blanc",
                        content: encodedContent,
                        sha: sha
                    })
                });

                if (response.ok) {
                    isModified = false;
                    alert("Contenu sauvegardé avec succès !");
                } else {
                    console.error("Erreur lors de la sauvegarde :", await response.text());
                }
            } catch (error) {
                console.error("Erreur :", error);
            }
        }

        // Efface le contenu
        function clearWhiteboard() {
            document.getElementById('whiteboard').innerHTML = "Écrivez ici...";
            markAsModified();
        }

        // Charge le contenu au démarrage
        window.onload = loadContent;

        // Sauvegarde automatique après 30 secondes d'inactivité
        let timeout;
        document.getElementById('whiteboard').addEventListener('input', () => {
            clearTimeout(timeout);
            timeout = setTimeout(saveContent, 30000); // 30 secondes
        });
    </script>
</body>
</html>
