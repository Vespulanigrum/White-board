<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau Blanc Texte</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #whiteboard {
            width: 80%;
            height: 80%;
            background-color: white;
            border: 2px solid #000;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            overflow: auto;
            font-size: 18px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="clearWhiteboard()">Effacer</button>
    </div>
    <div 
         id="whiteboard" 
         contenteditable="true" 
         oninput="saveContent()"
         onblur="saveContent()"
    >
        Écrivez ici...
    </div>

    <script>
        // Charger le contenu sauvegardé
        function loadContent() {
            const savedContent = localStorage.getItem('whiteboardContent');
            const savedDate = localStorage.getItem('whiteboardDate');
            
            if (savedContent && savedDate) {
                const lastModified = new Date(savedDate);
                const now = new Date();
                const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;
                
                // Si le contenu a plus de 7 jours, on l'efface
                if (now - lastModified > sevenDaysInMs) {
                    localStorage.removeItem('whiteboardContent');
                    localStorage.removeItem('whiteboardDate');
                    document.getElementById('whiteboard').innerHTML = 'Écrivez ici...';
                } else {
                    document.getElementById('whiteboard').innerHTML = savedContent;
                }
            }
        }

        // Sauvegarder le contenu
        function saveContent() {
            const content = document.getElementById('whiteboard').innerHTML;
            localStorage.setItem('whiteboardContent', content);
            localStorage.setItem('whiteboardDate', new Date().toISOString());
        }

        // Effacer manuellement
        function clearWhiteboard() {
            document.getElementById('whiteboard').innerHTML = 'Écrivez ici...';
            localStorage.removeItem('whiteboardContent');
            localStorage.removeItem('whiteboardDate');
        }

        // Charger le contenu au démarrage
        window.onload = loadContent;
    </script>
</body>
</html>
